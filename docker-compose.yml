services:
  postgres:
    image: postgres:17
    container_name: release-manager-db
    environment:
      POSTGRES_DB: release_manager
      POSTGRES_USER: release_manager
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: